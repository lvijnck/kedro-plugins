[project]
name = "feast-kedro-demo"
version = "0.1.0"
description = "Feast + Kedro demo: a feature repo and a Kedro project (ingestion + inference)."
requires-python = ">=3.10"

# Virtual workspace root: not itself a package, just ties the member(s) together.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipelines"]

# Use the local, in-repo kedro-datasets (editable) so FeastDataset changes are
# picked up.
[tool.uv.sources]
kedro-datasets = { path = "../kedro-datasets", editable = true }

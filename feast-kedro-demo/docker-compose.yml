# Spins up the Postgres instance used as Feast's online store.
#
#   docker compose up -d
#
# Credentials/ports here must match feature_repo/feature_store.yaml and
# conf/base/catalog.yml.
services:
  postgres:
    image: postgres:16
    container_name: feast-online-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: feast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

# Feast repo config used by `feast apply`.
# Offline store: BigQuery. Online store: Postgres (docker-compose / local).
# The registry path is shared with the Kedro pipelines via the FEAST_REGISTRY
# env var.
project: drug_repurposing
provider: local
registry: ${FEAST_REGISTRY}

offline_store:
  type: bigquery
  project_id: ${GCP_PROJECT}
  location: US

online_store:
  type: postgres
  host: ${POSTGRES_HOST}
  port: 5432
  database: feast
  db_schema: public
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  sslmode: prefer

entity_key_serialization_version: 3
